model:
  decoder: harmonics_noise
  implementation: null
  n_harmonics: 100
  n_noise_bands: 65
  z_dim: 16
  hidden_dim: 512
  encoder:
    fs: ${fs}
  synth:
    lagrange_order: 5
    n_fft: 2048
detector:
  use_external_detectors: true
training:
  objective: spectral_only
  w_param: 0.0
  w_mss: 1.0
  w_sot: 1.0
  w_tot: 0.0
  event_loss_weights: {}
data:
  has_synthetic: false
  has_ood: true
  nsynth:
    root: ${oc.env:PROJECT_ROOT,.}/src/data/nsynth
    split_train: training
    split_val: validation
experiment:
  eval_synthetic_metrics: false
  eval_ood_metrics: true
  max_epochs: 10000
  gradient_clip_val: 1.0
  batch_size: 32
  num_workers: 4
  val_check_interval: 1.0
  log_val_audio: true
  num_val_audio_examples: 4
  patience: 50
  min_delta: 0.0001
  scheduler_patience: 15
  scheduler_factor: 0.5
  min_lr: 1.0e-06
lr: 0.001
seed: 42
fs: 16000
num_audio_samples: 64000
num_frames: 250
duration_s: 4.0
