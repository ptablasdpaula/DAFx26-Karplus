defaults:
  - model: ksa_time
  - detector: end_to_end
  - training: combined
  - data: synth
  - _self_

hydra:
  run:
    dir: experiments/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

# ── Global Audio & Run Params ──
lr: 1e-3
seed: 42
fs: 16000
num_audio_samples: 64000
num_frames: 250
duration_s: 4.0

# ── Global Training Params ──
max_epochs: 10000
gradient_clip_val: 1.0
batch_size: 32
num_workers: 4
val_check_interval: 1.0
log_val_audio: true
num_val_audio_examples: 4

# Early Stopping
patience: 50
min_delta: 1e-4

# LR Scheduler
scheduler_patience: 15
scheduler_factor: 0.5
min_lr: 1e-6