synthetic:
  num_samples_per_epoch: 8360
  random_seed: 42
  max_events_per_sample: 10
  min_events_per_sample: 1
  detector_batch_size: 32

nsynth:
  # Set NSYNTH_DIR in the root .env to keep the dataset outside the repository.
  root: ${oc.env:NSYNTH_DIR,${oc.env:PROJECT_ROOT,.}/data/nsynth}
  split_train: training
  split_val: validation