eval_synthetic_metrics: false
eval_ood_metrics: true
max_epochs: 10000
gradient_clip_val: 1.0
batch_size: 32
num_workers: 4
val_check_interval: 1.0
log_val_audio: true
num_val_audio_examples: 4

# Early Stopping
patience: 50
min_delta: 1e-4  # 0.0001 - Ignores tiny numerical noise

# LR Scheduler (ReduceLROnPlateau)
scheduler_patience: 15
scheduler_factor: 0.5
min_lr: 1e-6