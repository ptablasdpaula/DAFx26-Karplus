# experiments.conf — Single source of truth for all experiment configurations.
# Each line is a set of Hydra overrides passed to train.py.
# Blank lines and lines starting with # are ignored.

# ── SYNTHETIC EVAL BASELINES ──
data=synth detector=end_to_end training=param_only     model=ksa_oracle
data=synth detector=end_to_end training=combined       model=ksa_freq
data=synth detector=end_to_end training=combined       model=ksa_time
data=synth detector=external   training=spectral_only  model=ksa_freq
data=synth detector=external   training=spectral_only  model=ksa_time

# ── NSYNTH OOD BASELINES ──
data=mix   detector=end_to_end training=combined       model=ksa_freq
data=mix   detector=end_to_end training=combined       model=ksa_time
data=real  detector=external   training=spectral_only  model=ksa_freq
data=real  detector=external   training=spectral_only  model=ksa_time

# ── DDSP Harmonics + Noise ──
data=real  detector=external   training=spectral_only  model=hn
data=real  detector=external   training=spectral_only  model=hn_tcn