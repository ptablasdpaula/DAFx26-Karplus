[workspace]
authors = ["Pablo Tablas <YOUR_USERNAME@qmul.ac.uk>"]
channels = ["conda-forge"]
name = "DAFx26-Karplus"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
numpy = ">=2.3.5,<3"
numba = ">=0.63.1,<0.64"
pytorch = ">=2.9.1,<3"
hydra-core = ">=1.3.2,<2"
lightning = ">=2.6.0,<3"
notebook = ">=7.5.2,<8"
ipykernel = ">=7.1.0,<8"
matplotlib = ">=3.10.8,<4"
ipywidgets = ">=8.1.8,<9"
llvm-openmp = ">=21.1.8,<22"
compilers = ">=1.11.0,<2"
cxx-compiler = ">=1.11.0,<2"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
netcdf4 = ">=1.7.4,<2"
hdf5 = ">=1.14.6,<2"
librosa = ">=0.11.0,<0.12"
pip = ">=26.0,<27"
libsndfile = ">=1.2.2,<2"
wandb = ">=0.24.1,<0.25"
torchaudio = ">=2.9.1,<3"
einops = ">=0.8.2,<0.9"
python = ">=3.11,<3.13"
pandas = ">=3.0.1,<4"
scipy = ">=1.17.1,<2"
dtw = ">=1.4.0,<2"
mir_eval = ">=0.8.2,<0.9"

[pypi-dependencies]
soundfile = "*"
torchcrepe = ">=0.0.24, <0.0.25"
philtorch = "*"
sot-loss = ">=0.1.3, <0.2"

[feature.cuda]
platforms = ["linux-64"]
system-requirements = { cuda = "12" }

[environments]
default = { solve-group = "cpu" }
cuda = { features = ["cuda"], solve-group = "cuda" }

[feature.cuda.dependencies]
cuda-toolkit = "*"
cuda-nvcc = "*"

[feature.cuda.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
TORCH_CUDA_ARCH_LIST = "8.0"
FORCE_CUDA = "1"
