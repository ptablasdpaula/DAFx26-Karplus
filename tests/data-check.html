<script>
window.addEventListener('error', e => {
  
// ── Both events, one FFT size: the artefact differs between them. ──────────
// Demo A now optimises the pluck at 0 s and the one at 3 s simultaneously, so
// the claim worth checking is that a single frame size does different damage to
// each — that is the whole reason for showing them side by side.
{
  const fft = meta.A.fftSizes[0];
  const target = meta.A.target;
  const settle = surface => {
    const walker = new Walker(surface, '#000', 'x');
    walker.reset(20, 60);
    for (let i = 0; i < 400; i += 1) walker.step();
    return {
      g: surface.xValues[Math.round(walker.col)],
      a: surface.yValues[Math.round(walker.row)],
    };
  };

  const rows = [];
  for (const onset of ['0s', '3s']) {
    const t = settle(new Surface('A', `A_${onset}_tksa`));
    const f = settle(new Surface('A', `A_${onset}_fksa${fft}`));
    rows.push({ onset, t, f, err: Math.abs(f.g - target.decay) });
    note(`${onset}: tKSA settles at g=${t.g.toFixed(4)}, fKSA/${fft} at g=${f.g.toFixed(4)} ` +
      `(true ${target.decay})`);
  }

  report('tKSA finds the answer for both events',
    rows.every(r => Math.abs(r.t.g - target.decay) < 0.01),
    rows.map(r => `${r.onset} g=${r.t.g.toFixed(4)}`).join(', '));
  report('fKSA misses for both events',
    rows.every(r => r.err > 0.002),
    rows.map(r => `${r.onset} off by ${r.err.toFixed(4)}`).join(', '));
  report('the two events are damaged differently by one frame size',
    Math.abs(rows[0].err - rows[1].err) > 1e-4,
    `event 1 off by ${rows[0].err.toFixed(4)}, event 2 by ${rows[1].err.toFixed(4)}`);
}


// ── One descent advances both events together, not one then the other. ─────
{
  const fft = meta.A.fftSizes[0];
  const made = ['0s', '3s'].flatMap(onset => ([
    new Walker(new Surface('A', `A_${onset}_tksa`), '#000', `t${onset}`),
    new Walker(new Surface('A', `A_${onset}_fksa${fft}`), '#000', `f${onset}`),
  ]));
  made.forEach(w => w.reset(20, 60));
  const before = made.map(w => [w.col, w.row]);
  // One tick of the demo: every walker steps once.
  made.forEach(w => w.step());
  const moved = made.filter((w, i) => w.col !== before[i][0] || w.row !== before[i][1]);
  report('a single step advances all four walkers', moved.length === 4,
    `${moved.length} of 4 moved on one tick (both events, both implementations)`);
  report('both events are still descending after 50 steps',
    (() => {
      for (let i = 0; i < 50; i += 1) made.forEach(w => w.step());
      return made.every(w => w.trail.length > 40);
    })(),
    `trail lengths ${made.map(w => w.trail.length).join(', ')}`);
}


// ── Adam, and the two implementations on their own surfaces. ───────────────
{
  const fft = meta.A.fftSizes[0];
  const sT = new Surface('A', 'A_3s_tksa');
  const sF = new Surface('A', `A_3s_fksa${fft}`);

  // The two surfaces genuinely differ — if they did not, plotting both walkers
  // on one heatmap would have been harmless.
  let maxDiff = 0;
  const nT = v => (v - sT.min) / (sT.max - sT.min);
  const nF = v => (v - sF.min) / (sF.max - sF.min);
  for (let i = 0; i < sT.data.length; i += 1) {
    maxDiff = Math.max(maxDiff, Math.abs(nT(sT.data[i]) - nF(sF.data[i])));
  }
  report('tKSA and fKSA are different surfaces', maxDiff > 0.2,
    `max normalised difference ${maxDiff.toFixed(3)} — each walker needs its own square`);

  // Adam must reach the answer on the well-formed surface.
  const adam = new Walker(sT, '#000', 'adam', { optimiser: 'adam' });
  adam.reset(20, 60);
  for (let i = 0; i < 600; i += 1) adam.step();
  const { col, row } = sT.argmin();
  report('Adam converges on the tKSA surface',
    Math.hypot(adam.col - col, adam.row - row) < 12,
    `settled ${Math.hypot(adam.col - col, adam.row - row).toFixed(1)} cells from the minimum ` +
    `at g=${sT.xValues[Math.round(adam.col)].toFixed(4)}`);

  // Adam has memory; steepest descent does not. Their paths must differ.
  const sgd = new Walker(sT, '#000', 'sgd', { optimiser: 'sgd' });
  sgd.reset(20, 60);
  for (let i = 0; i < 600; i += 1) sgd.step();
  const pathDiff = Math.hypot(adam.col - sgd.col, adam.row - sgd.row);
  report('Adam and steepest descent take different paths',
    adam.trail.length !== sgd.trail.length || pathDiff > 0.5,
    `${adam.trail.length} vs ${sgd.trail.length} steps`);
}


// ── A frame as long as the clip removes the artefact entirely. ─────────────
{
  const longest = meta.A.fftSizes[meta.A.fftSizes.length - 1];
  const shortest = meta.A.fftSizes[0];
  const truth = new Surface('A', 'A_3s_tksa').argmin();
  const tSurface = new Surface('A', 'A_3s_tksa');
  const errs = meta.A.fftSizes.map(n => {
    const s = new Surface('A', `A_3s_fksa${n}`);
    const m = s.argmin();
    return Math.abs(s.xValues[m.col] - meta.A.target.decay);
  });
  note(`fKSA decay error by frame: ${meta.A.fftSizes.map((n, i) =>
    `${(n / meta.fs).toFixed(2)}s ${errs[i].toFixed(4)}`).join('  ')}`);
  report('the error falls monotonically with frame length',
    errs.every((e, i) => i === 0 || e <= errs[i - 1] + 1e-9),
    errs.map(e => e.toFixed(4)).join(' → '));

  const full = new Surface('A', `A_3s_fksa${longest}`).argmin();
  report('a frame as long as the clip matches the time domain exactly',
    full.col === truth.col && full.row === truth.row,
    `fKSA/${longest} lands on g=${tSurface.xValues[full.col].toFixed(4)}, ` +
    `a1=${tSurface.yValues[full.row].toFixed(4)} — the same cell as tKSA`);
  report('the shortest frame is still badly wrong',
    errs[0] > errs[errs.length - 1] * 50,
    `${errs[0].toFixed(4)} at ${(shortest / meta.fs).toFixed(2)}s vs ` +
    `${errs[errs.length - 1].toFixed(4)} at ${(longest / meta.fs).toFixed(2)}s`);
}

document.getElementById('out').textContent = `UNCAUGHT: ${e.message}\n${e.filename}:${e.lineno}`;
});

// ── Landscape A: tKSA finds the target, fKSA does not, and is flatter. ──────
{
  const target = meta.A.target;
  const shortest = meta.A.fftSizes[0];

  for (const onset of ['0s', '3s']) {
    const t = new Surface('A', `A_${onset}_tksa`);
    const tMin = t.argmin();
    // Both axes are geometric, so tolerance has to come from the local spacing
    // near the point in question, not from the coarse end of the array.
    const localStep = (values, i) => Math.abs(
      values[Math.min(values.length - 1, i + 1)] - values[Math.max(0, i - 1)]) / 2;
    const gStep = localStep(t.xValues, tMin.col) * 3;
    const aStep = localStep(t.yValues, tMin.row) * 3;
    report(`A/${onset} tKSA minimum is the true answer`,
      Math.abs(t.xValues[tMin.col] - target.decay) < gStep &&
      Math.abs(t.yValues[tMin.row] - target.a1) < aStep,
      `g=${t.xValues[tMin.col].toFixed(4)} (true ${target.decay}), ` +
      `a1=${t.yValues[tMin.row].toFixed(4)} (true ${target.a1})`);

    const f = new Surface('A', `A_${onset}_fksa${shortest}`);
    const fMin = f.argmin();
    report(`A/${onset} fKSA/${shortest} minimum is displaced`,
      Math.abs(f.xValues[fMin.col] - target.decay) > gStep,
      `g=${f.xValues[fMin.col].toFixed(4)} vs true ${target.decay}`);

    const tRange = t.max - t.min;
    const fRange = f.max - f.min;
    report(`A/${onset} fKSA/${shortest} surface is flatter`, fRange < tRange / 3,
      `range ${fRange.toFixed(2)} vs tKSA ${tRange.toFixed(2)} (${(tRange / fRange).toFixed(1)}x)`);
  }

  // The displacement should shrink as the frame grows toward alias-free.
  const errs = meta.A.fftSizes.map(n => {
    const s = new Surface('A', `A_3s_fksa${n}`);
    return Math.abs(s.xValues[s.argmin().col] - target.decay);
  });
  report('A/3s fKSA error shrinks with FFT size',
    errs.every((e, i) => i === 0 || e <= errs[i - 1] + 1e-9),
    errs.map(e => e.toFixed(4)).join(' → '));
}

{
  const s = new Surface('A', 'A_3s_tksa');

  const walker = new Walker(s, '#000', 'tKSA');
  let worst = 0;
  for (const [c0, r0] of [[10, 10], [10, 80], [80, 10], [80, 80], [50, 50]]) {
    walker.reset(c0, r0);
    for (let i = 0; i < 300; i += 1) walker.step();
    worst = Math.max(worst, Math.hypot(walker.col - tc, walker.row - tr));
  }
  report('descent converges from every corner', worst < 12,
    `worst final distance ${worst.toFixed(1)} cells`);
}

// ── Landscape B: the sign test, following Table 1's protocol. ──────────────
// Table 1 perturbs one parameter at a time from the target, so measure f0
// along the target's own onset column and onset along its own f0 row.
// Averaging the whole grid instead mixes in initialisations whose onset is
// wildly wrong, where the f0 gradient carries no meaning, and buries the effect.
if (meta.B.terms) {
  const trainMix = meta.B.weights.sot / (meta.B.weights.sot + meta.B.weights.mss);

  const axisAccuracy = mix => {
    let onsetOk = 0, onsetN = 0, f0Ok = 0, f0N = 0;
    meta.B.targets.onsets.forEach((t, ti) => meta.B.targets.f0s.forEach((f, fi) => {
      const s = new Surface('B', `B_t${ti}_f${fi}_tksa`, mix);
      const c0 = nearestIndex(s.xValues, t);
      const r0 = nearestIndex(s.yValues, f);
      for (let c = 1; c < s.cols - 1; c += 1) {
        if (c === c0) continue;
        onsetN += 1;
        if (Math.sign(-s.gradient(c, r0, 1)[0]) === Math.sign(c0 - c)) onsetOk += 1;
      }
      for (let r = 1; r < s.rows - 1; r += 1) {
        if (r === r0) continue;
        f0N += 1;
        if (Math.sign(-s.gradient(c0, r, 1)[1]) === Math.sign(r0 - r)) f0Ok += 1;
      }
    }));
    return [100 * onsetOk / onsetN, 100 * f0Ok / f0N];
  };

  const [onsetMix, f0Mix] = axisAccuracy(trainMix);
  const [onsetMss, f0Mss] = axisAccuracy(0);
  const [onsetSot, f0Sot] = axisAccuracy(1);

  note(`onset: MSS ${onsetMss.toFixed(1)}%  SOT ${onsetSot.toFixed(1)}%  training mix ${onsetMix.toFixed(1)}%`);
  note(`f0:    MSS ${f0Mss.toFixed(1)}%  SOT ${f0Sot.toFixed(1)}%  training mix ${f0Mix.toFixed(1)}%`);

  // The surface is expected to have usable onset slope. That is not a
  // contradiction of the paper — it is the reason the demo must descend the
  // gradient field instead, which the next block checks.
  report('loss surface has onset slope (hence the gradient field)', onsetMss > 60,
    `${onsetMss.toFixed(1)}% off the surface, vs ~51% for the real gradient`);
  report('MSS gives a usable f0 direction', f0Mss > 65,
    `${f0Mss.toFixed(1)}% (paper L_MSS: 68-70%)`);
  report('SOT is weaker than MSS on f0', f0Sot < f0Mss - 5,
    `SOT ${f0Sot.toFixed(1)}% vs MSS ${f0Mss.toFixed(1)}% (paper L_SOT: 50-55%)`);
  report('training mix inherits SOT behaviour on f0', Math.abs(f0Mix - f0Sot) < 5,
    `mix ${f0Mix.toFixed(1)}% vs SOT ${f0Sot.toFixed(1)}% (w_SOT=1.0 dominates w_MSS=0.05)`);
} else {
  report('landscape B has split loss terms', false,
    'manifest predates the split — rerun tools/precompute_landscapes.py');
}


// ── The gradient field: the measurement Table 1 actually reports. ──────────
// The surface above has usable slope on onset; the gradient reaching the model
// does not. That gap is the point of Section 2.3, so assert both halves.
if (meta.G) {
  let gOnsetOk = 0, gOnsetN = 0, gF0Ok = 0, gF0N = 0;
  let sOnsetOk = 0, sOnsetN = 0;
  meta.B.targets.onsets.forEach((t, ti) => meta.B.targets.f0s.forEach((f, fi) => {
    const field = new GradientField(`G_t${ti}_f${fi}_tksa`);
    const r0 = nearestIndex(field.yValues, f);
    const c0 = nearestIndex(field.xValues, t);
    for (let c = 0; c < field.cols; c += 1) {
      if (c === c0) continue;
      const [dt] = field.at(field.xValues[c], field.yValues[r0]);
      gOnsetN += 1;
      if (Math.sign(-dt) === Math.sign(c0 - c)) gOnsetOk += 1;
    }
    for (let r = 0; r < field.rows; r += 1) {
      if (r === r0) continue;
      const [, df0] = field.at(field.xValues[c0], field.yValues[r]);
      gF0N += 1;
      if (Math.sign(-df0) === Math.sign(r0 - r)) gF0Ok += 1;
    }
    // Same axis, measured off the loss surface, for the contrast.
    const surf = new Surface('B', `B_t${ti}_f${fi}_tksa`,
      meta.B.weights.sot / (meta.B.weights.sot + meta.B.weights.mss));
    const sc0 = nearestIndex(surf.xValues, t);
    const sr0 = nearestIndex(surf.yValues, f);
    for (let c = 1; c < surf.cols - 1; c += 1) {
      if (c === sc0) continue;
      sOnsetN += 1;
      if (Math.sign(-surf.gradient(c, sr0, 1)[0]) === Math.sign(sc0 - c)) sOnsetOk += 1;
    }
  }));

  const gOnset = 100 * gOnsetOk / gOnsetN;
  const gF0 = 100 * gF0Ok / gF0N;
  const sOnset = 100 * sOnsetOk / sOnsetN;
  note(`onset sign accuracy: loss surface ${sOnset.toFixed(1)}%  vs  true gradient ${gOnset.toFixed(1)}%`);
  note(`f0 sign accuracy (true gradient): ${gF0.toFixed(1)}%`);

  report('true onset gradient is a coin flip', gOnset > 44 && gOnset < 60,
    `${gOnset.toFixed(1)}% (paper Table 1: 51.2%)`);
  report('the loss surface is more informative than the gradient', sOnset > gOnset + 5,
    `surface ${sOnset.toFixed(1)}% vs gradient ${gOnset.toFixed(1)}% — the gap Section 2.3 is about`);
} else {
  report('gradient field present', false,
    'run PRECOMPUTE_ONLY=G tools/precompute_landscapes.py');
}


// ── Both events, one FFT size: the artefact differs between them. ──────────
// Demo A now optimises the pluck at 0 s and the one at 3 s simultaneously, so
// the claim worth checking is that a single frame size does different damage to
// each — that is the whole reason for showing them side by side.
{
  const fft = meta.A.fftSizes[0];
  const target = meta.A.target;
  const settle = surface => {
    const walker = new Walker(surface, '#000', 'x');
    walker.reset(20, 60);
    for (let i = 0; i < 400; i += 1) walker.step();
    return {
      g: surface.xValues[Math.round(walker.col)],
      a: surface.yValues[Math.round(walker.row)],
    };
  };

  const rows = [];
  for (const onset of ['0s', '3s']) {
    const t = settle(new Surface('A', `A_${onset}_tksa`));
    const f = settle(new Surface('A', `A_${onset}_fksa${fft}`));
    rows.push({ onset, t, f, err: Math.abs(f.g - target.decay) });
    note(`${onset}: tKSA settles at g=${t.g.toFixed(4)}, fKSA/${fft} at g=${f.g.toFixed(4)} ` +
      `(true ${target.decay})`);
  }

  report('tKSA finds the answer for both events',
    rows.every(r => Math.abs(r.t.g - target.decay) < 0.01),
    rows.map(r => `${r.onset} g=${r.t.g.toFixed(4)}`).join(', '));
  report('fKSA misses for both events',
    rows.every(r => r.err > 0.002),
    rows.map(r => `${r.onset} off by ${r.err.toFixed(4)}`).join(', '));
  report('the two events are damaged differently by one frame size',
    Math.abs(rows[0].err - rows[1].err) > 1e-4,
    `event 1 off by ${rows[0].err.toFixed(4)}, event 2 by ${rows[1].err.toFixed(4)}`);
}


// ── One descent advances both events together, not one then the other. ─────
{
  const fft = meta.A.fftSizes[0];
  const made = ['0s', '3s'].flatMap(onset => ([
    new Walker(new Surface('A', `A_${onset}_tksa`), '#000', `t${onset}`),
    new Walker(new Surface('A', `A_${onset}_fksa${fft}`), '#000', `f${onset}`),
  ]));
  made.forEach(w => w.reset(20, 60));
  const before = made.map(w => [w.col, w.row]);
  // One tick of the demo: every walker steps once.
  made.forEach(w => w.step());
  const moved = made.filter((w, i) => w.col !== before[i][0] || w.row !== before[i][1]);
  report('a single step advances all four walkers', moved.length === 4,
    `${moved.length} of 4 moved on one tick (both events, both implementations)`);
  report('both events are still descending after 50 steps',
    (() => {
      for (let i = 0; i < 50; i += 1) made.forEach(w => w.step());
      return made.every(w => w.trail.length > 40);
    })(),
    `trail lengths ${made.map(w => w.trail.length).join(', ')}`);
}


// ── Adam, and the two implementations on their own surfaces. ───────────────
{
  const fft = meta.A.fftSizes[0];
  const sT = new Surface('A', 'A_3s_tksa');
  const sF = new Surface('A', `A_3s_fksa${fft}`);

  // The two surfaces genuinely differ — if they did not, plotting both walkers
  // on one heatmap would have been harmless.
  let maxDiff = 0;
  const nT = v => (v - sT.min) / (sT.max - sT.min);
  const nF = v => (v - sF.min) / (sF.max - sF.min);
  for (let i = 0; i < sT.data.length; i += 1) {
    maxDiff = Math.max(maxDiff, Math.abs(nT(sT.data[i]) - nF(sF.data[i])));
  }
  report('tKSA and fKSA are different surfaces', maxDiff > 0.2,
    `max normalised difference ${maxDiff.toFixed(3)} — each walker needs its own square`);

  // Adam must reach the answer on the well-formed surface.
  const adam = new Walker(sT, '#000', 'adam', { optimiser: 'adam' });
  adam.reset(20, 60);
  for (let i = 0; i < 600; i += 1) adam.step();
  const { col, row } = sT.argmin();
  report('Adam converges on the tKSA surface',
    Math.hypot(adam.col - col, adam.row - row) < 12,
    `settled ${Math.hypot(adam.col - col, adam.row - row).toFixed(1)} cells from the minimum ` +
    `at g=${sT.xValues[Math.round(adam.col)].toFixed(4)}`);

  // Adam has memory; steepest descent does not. Their paths must differ.
  const sgd = new Walker(sT, '#000', 'sgd', { optimiser: 'sgd' });
  sgd.reset(20, 60);
  for (let i = 0; i < 600; i += 1) sgd.step();
  const pathDiff = Math.hypot(adam.col - sgd.col, adam.row - sgd.row);
  report('Adam and steepest descent take different paths',
    adam.trail.length !== sgd.trail.length || pathDiff > 0.5,
    `${adam.trail.length} vs ${sgd.trail.length} steps`);
}


// ── A frame as long as the clip removes the artefact entirely. ─────────────
{
  const longest = meta.A.fftSizes[meta.A.fftSizes.length - 1];
  const shortest = meta.A.fftSizes[0];
  const truth = new Surface('A', 'A_3s_tksa').argmin();
  const tSurface = new Surface('A', 'A_3s_tksa');
  const errs = meta.A.fftSizes.map(n => {
    const s = new Surface('A', `A_3s_fksa${n}`);
    const m = s.argmin();
    return Math.abs(s.xValues[m.col] - meta.A.target.decay);
  });
  note(`fKSA decay error by frame: ${meta.A.fftSizes.map((n, i) =>
    `${(n / meta.fs).toFixed(2)}s ${errs[i].toFixed(4)}`).join('  ')}`);
  report('the error falls monotonically with frame length',
    errs.every((e, i) => i === 0 || e <= errs[i - 1] + 1e-9),
    errs.map(e => e.toFixed(4)).join(' → '));

  const full = new Surface('A', `A_3s_fksa${longest}`).argmin();
  report('a frame as long as the clip matches the time domain exactly',
    full.col === truth.col && full.row === truth.row,
    `fKSA/${longest} lands on g=${tSurface.xValues[full.col].toFixed(4)}, ` +
    `a1=${tSurface.yValues[full.row].toFixed(4)} — the same cell as tKSA`);
  report('the shortest frame is still badly wrong',
    errs[0] > errs[errs.length - 1] * 50,
    `${errs[0].toFixed(4)} at ${(shortest / meta.fs).toFixed(2)}s vs ` +
    `${errs[errs.length - 1].toFixed(4)} at ${(longest / meta.fs).toFixed(2)}s`);
}

document.getElementById('out').textContent =
  lines.join('\n') + `\n\n${failures === 0 ? 'ALL CHECKS PASSED' : `${failures} CHECK(S) FAILED`}`;
</script>
</body>
</html>
