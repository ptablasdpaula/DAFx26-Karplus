<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page behaviour checks</title>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Drives the page modules the way a reader would, without needing a real
// browsing session. Run with:
//   Chrome --headless --virtual-time-budget=20000 --dump-dom tests/page-check.html
import { OriginalKsaProcessor } from '../assets/js/interactive-ks.js';
import { sampleResponse } from '../assets/js/ks-response.js';
import { responseCurveDb } from '../assets/js/section-ksa.js';
import { renderMatchSignal, matchEvents, MATCH_F0 } from '../assets/js/section-match.js';

const lines = [];
let failures = 0;
const report = (name, ok, detail = '') => {
  if (!ok) failures += 1;
  lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? `  ${detail}` : ''}`);
};

// ── Quantisation is audible at the top of the range, negligible at the bottom.
{
  const fs = 48000;
  const cents = f0 => {
    const n = OriginalKsaProcessor.delayLengthFor(f0, fs);
    return Math.abs(1200 * Math.log2(OriginalKsaProcessor.soundingFrequency(n, fs) / f0));
  };
  // Worst case over a semitone sweep near each end.
  const sweep = (lo, hi) => {
    let worst = 0;
    for (let f = lo; f <= hi; f += 0.25) worst = Math.max(worst, cents(f));
    return worst;
  };
  const low = sweep(80, 120);
  const high = sweep(1000, 1200);
  // ~5 cents is the usual pitch JND, so the claim is: inaudible down low,
  // clearly audible up high. Both must hold for Section 1.1's argument to land.
  report('low notes tune below the JND', low < 5.0, `worst ${low.toFixed(2)} cents`);
  report('high notes quantise audibly', high > 10.0, `worst ${high.toFixed(2)} cents`);
}

// ── The analytic response actually responds to each knob. ───────────────────
{
  const fs = 48000;
  const base = { f0: 220, decay: 0.99, damping: 0.28, pluck: 0.25, dynamic: 0.6 };
  const curveOf = over => sampleResponse({ ...base, ...over }, { fs, points: 512 });
  const diff = (a, b) => {
    let d = 0;
    for (let i = 0; i < a.length; i += 1) d = Math.max(d, Math.abs(a[i] - b[i]));
    return d;
  };
  const reference = curveOf({});
  for (const [name, over] of [
    ['decay', { decay: 0.999 }],
    ['damping', { damping: 0.7 }],
    ['pluck position', { pluck: 0.5 }],
    ['dynamics', { dynamic: 0.1 }],
    ['f0', { f0: 440 }],
  ]) {
    const d = diff(reference, curveOf(over));
    report(`analytic curve responds to ${name}`, d > 0.5, `max Δ ${d.toFixed(1)} dB`);
  }
}

// ── Comb spacing equals the sounding fundamental. ───────────────────────────
{
  const fs = 48000;
  const f0 = 220;
  const points = 8192;
  const n = OriginalKsaProcessor.delayLengthFor(f0, fs);
  const sounding = OriginalKsaProcessor.soundingFrequency(n, fs);
  const curve = sampleResponse({ delayLength: n, decayGain: 0.996 },
    { fs, points, mode: 'original' });
  // Local maxima above -30 dB are the comb teeth.
  const peaks = [];
  for (let i = 1; i < curve.length - 1; i += 1) {
    if (curve[i] > curve[i - 1] && curve[i] >= curve[i + 1] && curve[i] > -30) {
      peaks.push((i / (points - 1)) * (fs / 2));
    }
  }
  let worst = 0;
  for (let k = 1; k < Math.min(peaks.length, 12); k += 1) {
    worst = Math.max(worst, Math.abs((peaks[k] - peaks[k - 1]) - sounding));
  }
  report('comb spacing equals fs/(N + 1/2)', peaks.length >= 5 && worst < sounding * 0.05,
    `${peaks.length} teeth, spacing error ≤ ${worst.toFixed(1)} Hz vs f0 ${sounding.toFixed(1)} Hz`);
}


// ── The frequency control: logarithmic, and quantised in original mode. ────
{
  const fs = 48000;
  const F0_MIN = 60, F0_MAX = 1200;
  const sliderToF0 = v => F0_MIN * (F0_MAX / F0_MIN) ** v;
  const longest = OriginalKsaProcessor.delayLengthFor(F0_MIN, fs);
  const shortest = OriginalKsaProcessor.delayLengthFor(F0_MAX, fs);

  // Equal slider travel must be equal musical interval, in extended mode.
  const intervals = [];
  for (let v = 0; v < 1; v += 0.1) {
    intervals.push(1200 * Math.log2(sliderToF0(v + 0.1) / sliderToF0(v)));
  }
  const spread = Math.max(...intervals) - Math.min(...intervals);
  report('extended frequency slider is logarithmic', spread < 1e-6,
    `${intervals[0].toFixed(1)} cents per 10% of travel, spread ${spread.toExponential(1)}`);

  // In original mode the slider is in index space: one position per reachable
  // delay length, so an unreachable pitch cannot be selected at all.
  const positions = longest - shortest;
  const pitches = new Set();
  for (let i = 0; i <= positions; i += 1) {
    pitches.add(OriginalKsaProcessor.soundingFrequency(longest - i, fs).toFixed(6));
  }
  report('every original-mode slider position is reachable',
    pitches.size === positions + 1,
    `${positions + 1} positions, ${pitches.size} distinct pitches — one each`);

  // 60 Hz is only selectable if some whole N actually produces it.
  const nAt60 = OriginalKsaProcessor.delayLengthFor(60, fs);
  const got60 = OriginalKsaProcessor.soundingFrequency(nAt60, fs);
  report('the slider cannot rest on an unreachable pitch',
    Math.abs(got60 - 60) < 1e-9 || pitches.has(got60.toFixed(6)),
    `bottom of range lands on ${got60.toFixed(4)} Hz (N=${nAt60}), not an arbitrary 60.00`);

  const stepAt = f0 => {
    const n = OriginalKsaProcessor.delayLengthFor(f0, fs);
    return Math.abs(1200 * Math.log2(
      OriginalKsaProcessor.soundingFrequency(n - 1, fs) /
      OriginalKsaProcessor.soundingFrequency(n, fs)));
  };
  const low = stepAt(80);
  const high = stepAt(1100);
  report('quantisation coarsens towards high notes', high > low * 8,
    `${low.toFixed(2)} cents at 80 Hz vs ${high.toFixed(2)} cents at 1100 Hz`);
}

// ── A gentler pluck must be quieter, not merely duller. ────────────────────
{
  const fs = 48000;
  const base = { mode: 'extended', f0: 220, decay: 0.99, damping: 0.28, pluck: 0.25 };
  const peakOf = d => Math.max(...responseCurveDb({ ...base, dynamic: d }, fs, 512));
  const loud = peakOf(1.0);
  const soft = peakOf(0.25);
  report('lowering dynamics lowers the whole response', loud - soft > 10,
    `peak ${loud.toFixed(1)} dB at d=1 vs ${soft.toFixed(1)} dB at d=0.25`);
  // And the drop should track the excitation amplitude, i.e. 20log10(d).
  const expected = 20 * Math.log10(1 / 0.25);
  report('the drop matches 20log10(d)', Math.abs((loud - soft) - expected) < 0.5,
    `${(loud - soft).toFixed(2)} dB vs expected ${expected.toFixed(2)} dB`);
}


// ── The two-event matching widget renders the structure it claims. ─────────
{
  const FS = 16000;
  const rms = (sig, from, to) => {
    let sum = 0;
    for (let i = from; i < to; i += 1) sum += sig[i] * sig[i];
    return Math.sqrt(sum / (to - from));
  };

  const signal = renderMatchSignal();
  report('render produces 4 s at 16 kHz', signal.length === FS * 4, `${signal.length} samples`);

  // A pluck at 0 s decaying, then a second event at 3 s.
  const attack = rms(signal, 0, FS * 0.2);
  const beforeSecond = rms(signal, FS * 2.8, FS * 2.98);
  const afterSecond = rms(signal, FS * 3.02, FS * 3.2);
  report('first event decays before the second', attack > beforeSecond * 3,
    `attack ${attack.toExponential(2)} vs ${beforeSecond.toExponential(2)} at 2.9 s`);
  // With its default settings the second event is a release: a small burst and
  // heavy damping, so the string dies rather than restarting. Turn its dynamics
  // up and it becomes a second pluck instead. Both must be reachable — that is
  // what makes the two events genuinely independent.
  report('the release damps the string', afterSecond < beforeSecond,
    `${afterSecond.toExponential(2)} after 3 s vs ${beforeSecond.toExponential(2)} before`);

  const mutedDynamic = matchEvents[1].dynamic;
  const mutedDecay = matchEvents[1].decay;
  const mutedDamping = matchEvents[1].damping;
  Object.assign(matchEvents[1], { dynamic: 1, decay: 0.995, damping: 0.32 });
  const replucked = renderMatchSignal();
  const loudAfter = rms(replucked, FS * 3.02, FS * 3.2);
  Object.assign(matchEvents[1], { dynamic: mutedDynamic, decay: mutedDecay, damping: mutedDamping });
  report('a loud second event re-excites the string', loudAfter > beforeSecond * 2,
    `${loudAfter.toExponential(2)} after a full-strength pluck vs ${beforeSecond.toExponential(2)} before`);

  // Event 2's parameters must not reach backwards in time.
  const before = signal.slice(0, FS * 3);
  const original = matchEvents[1].damping;
  matchEvents[1].damping = 0.9;
  const changed = renderMatchSignal();
  let maxDiffBefore = 0;
  for (let i = 0; i < FS * 3; i += 1) {
    maxDiffBefore = Math.max(maxDiffBefore, Math.abs(changed[i] - before[i]));
  }
  const diffAfter = Math.abs(rms(changed, FS * 3.1, FS * 3.6) - rms(signal, FS * 3.1, FS * 3.6));
  matchEvents[1].damping = original;
  report('event 2 changes nothing before its onset', maxDiffBefore === 0,
    `max difference before 3 s: ${maxDiffBefore.toExponential(1)}`);
  report('event 2 changes what follows it', diffAfter > 1e-4,
    `RMS shift after 3 s: ${diffAfter.toExponential(2)}`);

  // The pitch should be the target's, and audible in the signal.
  report('renders at the target pitch', Math.abs(MATCH_F0 - 89.3) < 0.1, `${MATCH_F0} Hz`);
}

document.getElementById('out').textContent =
  lines.join('\n') + `\n\n${failures === 0 ? 'ALL CHECKS PASSED' : `${failures} CHECK(S) FAILED`}`;
</script>
</body>
</html>
